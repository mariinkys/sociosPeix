# Form template — Hotel Casa Peix "Ficha de Registro"
# Derived from probe output on 2026-08-02.

render_dpi = 300

[ocr]
det_model  = "pp-ocrv5_mobile_det.onnx"
rec_model  = "latin_pp-ocrv5_mobile_rec.onnx"
char_dict  = "ppocrv5_latin_dict.txt"

det_box_threshold   = 0.4
det_score_threshold = 0.3
det_unclip_ratio    = 1.8
rec_score_threshold = 0.0

image_batch_size  = 8
region_batch_size = 16

