name: Publish Docker images

on:
  workflow_dispatch:
    inputs:
      service:
        description: Which image(s) to build and push
        required: true
        type: choice
        default: all
        options: [all, backend, frontend]
      release_tag:
        description: "Optional release tag (e.g. v0.3.0). Empty = publish :latest and :sha-<commit>"
        required: false
        type: string
      release_name:
        description: Display name for the draft GitHub release (only with a release tag)
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - name: Skip unselected image
        id: gate
        run: echo "run=${{ inputs.service == 'all' || inputs.service == matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.gate.outputs.run == 'true'

      - uses: docker/setup-buildx-action@v4
        if: steps.gate.outputs.run == 'true'

      - uses: docker/login-action@v4
        if: steps.gate.outputs.run == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: steps.gate.outputs.run == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=sha,prefix=sha-,enable=${{ inputs.release_tag == '' }}
            type=raw,value=latest,enable=${{ inputs.release_tag == '' }}

      - uses: docker/build-push-action@v7
        if: steps.gate.outputs.run == 'true'
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in GitHub Actions: unchanged layers aren't rebuilt.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          secrets: |
            vite_primeui_license_key=${{ secrets.PRIMEUI_LICENSE_KEY }}

  release:
    needs: images
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name || inputs.release_tag }}
          draft: true
          body: |
            ## Docker images

            ${{ (inputs.service == 'all' || inputs.service == 'backend') && format('- `ghcr.io/{0}-backend:{1}`', github.repository, inputs.release_tag) || '' }}
            ${{ (inputs.service == 'all' || inputs.service == 'frontend') && format('- `ghcr.io/{0}-frontend:{1}`', github.repository, inputs.release_tag) || '' }}

            Deploy with `IMAGE_TAG=${{ inputs.release_tag }}` in your `.env`.
