# Production stack: PostgreSQL + Rust backend + Vue frontend (nginx).
#
# Only the frontend is published; nginx serves the SPA and proxies /api to the
# backend over the internal network. Configure everything in `.env`
# (see .env.example), then:  docker compose up -d

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-sociosPeix}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required}-backend:${IMAGE_TAG:-latest}
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-sociosPeix}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (at least 32 characters)}
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@resend.dev}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAILTRAP_API_KEY: ${MAILTRAP_API_KEY:-}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Madrid}
      # The backend is only reachable through the frontend's nginx, so the
      # client IP it forwards (X-Real-IP) can be trusted for rate limiting.
      TRUST_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}-frontend:${IMAGE_TAG:-latest}
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  postgres_data:
