app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  cookie:
    secure: ${COOKIE_SECURE:false}   # set to true in production (requires HTTPS)
  security:
    max-login-attempts: 5
    lockout-duration-minutes: 15
    trust-proxy: ${TRUST_PROXY:false} # only set true when behind a trusted proxy
    filter:
      order: 10

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sociosPeix}
    username: ${DB_USERNAME:youruser}
    password: ${DB_PASSWORD:yourpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # IMPORTANT: Flyway manages schema, not Hibernate
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-this-please-32chars}
    expiration: 10800000

email:
  from: ${EMAIL_FROM:onboarding@resend.dev}
  providers:
    resend:
      api-key: ${RESEND_API_KEY:re_key}
      daily-limit: 100
    mailtrap:
      api-key: ${MAILTRAP_API_KEY:mt_key}
      daily-limit: 150