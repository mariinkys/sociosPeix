app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  cookie:
    secure: ${COOKIE_SECURE:false}   # set to true in production (requires HTTPS)
  security:
    max-login-attempts: 5
    lockout-duration-minutes: 15
    trust-proxy: ${TRUST_PROXY:false} # only set true when behind a trusted proxy

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/yourdb
    username: youruser
    password: yourpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: your-256-bit-secret-key-change-this-in-production-please
    expiration: 10800000

email:
  from: ${EMAIL_FROM:onboarding@resend.dev}
  providers:
    resend:
      api-key: ${RESEND_API_KEY}
      daily-limit: 100